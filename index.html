<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<title>Sudoku — Asta Games</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#141e31;--panel2:#1b2940;--line:#33445e;--muted:#92a4c2;--text:#f3f6ff;--accent:#66d9b5;--accent2:#3bb794;--bad:#ff7185}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#243a54 0,#101827 50%,#090e18 100%);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:20px 14px calc(28px + env(safe-area-inset-bottom))}
button,select{font:inherit}
.app{width:min(100%,560px)}
header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:40px;height:40px;border:1px solid #ffffff24;border-radius:13px;background:linear-gradient(145deg,#31435d,#1a273b);display:grid;place-items:center;color:var(--accent);font-weight:950;font-size:15px;letter-spacing:-.12em;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #66d9b522}.mark:before{content:"";position:absolute;inset:7px;background:linear-gradient(90deg,transparent 30%,#66d9b555 31%,#66d9b555 36%,transparent 37%,transparent 63%,#66d9b555 64%,#66d9b555 69%,transparent 70%),linear-gradient(0deg,transparent 30%,#66d9b555 31%,#66d9b555 36%,transparent 37%,transparent 63%,#66d9b555 64%,#66d9b555 69%,transparent 70%);opacity:.65}.mark span{position:relative;text-shadow:0 1px 8px #66d9b577}
.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:26px;line-height:1;margin:3px 0 0;letter-spacing:.08em}
.top-btn,.primary,.secondary,.key,.tool{border:0;color:var(--text);cursor:pointer;touch-action:manipulation;transition:transform .08s,background .15s}
button:active{transform:scale(.97)}
.top-btn{background:var(--panel2);border:1px solid #ffffff12;padding:10px 13px;border-radius:12px;font-weight:700}
.panel{background:#121c2edb;border:1px solid #ffffff12;border-radius:20px;padding:16px;box-shadow:0 24px 70px #0004}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.stat{background:#1a2639;border-radius:12px;padding:9px 11px;min-width:0}
.stat-label{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.stat-value{font-size:18px;font-weight:800;margin-top:1px}
.game{position:relative}
.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border:2px solid #8293aa;border-radius:10px;overflow:hidden;background:#101827;touch-action:manipulation}
.cell{position:relative;border:0;border-right:1px solid #657894;border-bottom:1px solid #657894;padding:0;background:#121c2c;color:#e6edfa;font-size:clamp(17px,5.5vw,27px);font-weight:600;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0}
.cell:nth-child(9n){border-right:0}
.cell:nth-child(n+73){border-bottom:0}
.cell.box-right{border-right:3px solid #9aacc4}
.cell.box-bottom{border-bottom:3px solid #9aacc4}
.cell.odd-box{background:#17322f}.cell.related{background:#1b2b40}
.cell.same-number{background:#25423f;color:#d6fff3}
.cell.selected{background:#315c58!important;color:white;box-shadow:inset 0 0 0 2px var(--accent);z-index:1}
.cell.given{color:#f1f4fb;font-weight:850}
.cell.conflict,.cell.wrong{color:#ffd8dc;background:#572c3a}
.board.hint-active .cell:not(.hint-context):not(.hint-blocker):not(.hint-target){opacity:.2;filter:grayscale(.75)}
.cell.hint-context{opacity:1!important;background:#23453f!important;color:#f2fff9!important;transition:opacity .25s,transform .25s,background .25s}
.cell.hint-blocker{opacity:1!important;background:#48435a!important;color:#fff8e8!important;outline:2px solid #f0cc74;outline-offset:-3px;z-index:2}
.cell.hint-target{opacity:1!important;background:var(--accent2)!important;color:#071b17!important;transform:scale(1.1);z-index:4;box-shadow:0 0 0 3px #b3ffe9,0 0 18px #66d9b5;animation:hintPulse .75s ease-in-out infinite alternate}
@keyframes hintPulse{from{transform:scale(1.06)}to{transform:scale(1.14)}}
@media(prefers-reduced-motion:reduce){.cell.hint-target{animation:none}.cell.hint-context{transition:none}}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(7px,2.3vw,11px);line-height:1;color:#8fa4c0;font-weight:500}
.notes span{display:grid;place-items:center}
.keypad{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin:14px auto 11px;max-width:410px;padding:0 2px;overflow:hidden}.key{grid-column:span 2}.key:nth-child(6){grid-column:2 / span 2}.key:nth-child(7){grid-column:4 / span 2}.key:nth-child(8){grid-column:6 / span 2}.key:nth-child(9){grid-column:8 / span 2}
.key{aspect-ratio:1.55;background:#21314a;border:1px solid #ffffff0d;border-radius:11px;color:#d9e5f6;font-size:21px;font-weight:850;padding:0;min-height:42px;min-width:0;width:92%;justify-self:center;overflow:hidden}
.key:active,.key.active{background:#2f5a54;color:#caffef}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tool{background:#1b2940;border:1px solid #ffffff0d;border-radius:10px;padding:8px 4px;font-size:10px;font-weight:700;color:#dbe5f4}
.tool.active{background:#244d48;color:#bff7e4;border-color:#3f9b83}
.tool:disabled,.key:disabled{opacity:.4;cursor:not-allowed}
.message{min-height:24px;text-align:center;color:var(--muted);font-size:12px;padding:9px 4px 0}
.overlay{position:absolute;inset:0;background:#08101bdc;backdrop-filter:blur(5px);border-radius:9px;display:grid;place-items:center;padding:18px;z-index:3}
.overlay.hidden{display:none}
.dialog{width:min(100%,330px);background:#19263a;border:1px solid #ffffff20;border-radius:18px;padding:20px;text-align:center;box-shadow:0 18px 55px #0008}
.dialog-icon{font-size:35px;line-height:1.2;margin-bottom:7px}
.dialog h2{font-size:22px;margin:0 0 6px}
.dialog p{font-size:13px;color:#afbdd2;line-height:1.5;margin:0 0 15px}
.dialog select{width:100%;background:#101827;border:1px solid #45546a;color:white;border-radius:11px;padding:11px;margin:0 0 10px}
.primary{width:100%;padding:12px;border-radius:11px;background:var(--accent2);color:#071b17;font-weight:900}
.secondary{width:100%;padding:11px;border-radius:11px;background:#29374d;font-weight:800;margin-top:8px}
.status{font-size:11px;color:var(--muted);text-align:center;margin-top:13px}
@media(min-width:520px){body{padding-top:28px}.panel{padding:20px}.key{font-size:23px;min-height:46px}.tool{font-size:11px}.cell{font-size:27px}}
@media(max-width:360px){.panel{padding:11px}.keypad{gap:5px;padding:0}.key{border-radius:8px;font-size:20px;min-height:39px}.tool{font-size:9px;padding:8px 2px}.stat{padding:8px}}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="brand"><div class="mark" aria-label="Sudoku em japonês"><span>数独</span></div><div><div class="eyebrow">Zen Grid</div><h1>SUDOKU</h1></div></div>
  <button class="top-btn" id="newTop">＋ Novo</button>
</header>
<section class="panel">
  <div class="stats">
    <div class="stat"><div class="stat-label">Tempo</div><div class="stat-value" id="time">00:00</div></div>
    <div class="stat"><div class="stat-label">Erros</div><div class="stat-value" id="mistakes">0</div></div>
    <div class="stat"><div class="stat-label">Dicas</div><div class="stat-value" id="hints">3</div></div>
  </div>
  <div class="game">
    <div class="board" id="board" role="grid" aria-label="Tabuleiro de Sudoku"></div>
    <div class="overlay" id="overlay">
      <div class="dialog">
        <div class="dialog-icon" id="dialogIcon">🧩</div>
        <h2 id="dialogTitle">Vamos jogar?</h2>
        <p id="dialogText">Escolha o nível e complete cada linha, coluna e bloco com os números de 1 a 9.</p>
        <select id="difficulty" aria-label="Dificuldade">
          <option value="easy">Fácil</option><option value="medium" selected>Médio</option><option value="hard">Difícil</option>
        </select>
        <button class="primary" id="startBtn">Começar partida</button>
        <button class="secondary" id="resumeBtn" hidden>Continuar</button>
      </div>
    </div>
  </div>
  <div class="keypad" id="keypad" aria-label="Teclado numérico"></div>
  <div class="tools">
    <button class="tool" id="notesBtn">✎ Anotar</button>
    <button class="tool" id="eraseBtn">⌫ Apagar</button>
    <button class="tool" id="hintBtn">✦ Dica</button>
    <button class="tool" id="checkBtn">✓ Conferir</button>
  </div>
  <div class="message" id="message">Toque em “Começar partida” para jogar.</div>
</section>
<div class="status">Toque em uma casa e escolha um número • As regras ficam no menu do jogo</div>
</main>
<script>
(()=>{
const boardEl=document.getElementById("board"),overlay=document.getElementById("overlay");
const $=id=>document.getElementById(id);
let puzzle=[],solution=[],notes=[],selected=-1,started=false,paused=false,finished=false,noteMode=false,mistakes=0,hints=3,seconds=0,tick=null,showErrors=false,difficulty="medium",hintVisual=null,hintTimer=null;
const cells=[];
for(let i=0;i<81;i++){const b=document.createElement("button");b.className="cell";b.type="button";b.setAttribute("role","gridcell");b.setAttribute("aria-label","Casa "+(i+1));if(i%9===2||i%9===5)b.classList.add("box-right");if(Math.floor(i/9)===2||Math.floor(i/9)===5)b.classList.add("box-bottom");b.addEventListener("click",()=>selectCell(i));boardEl.appendChild(b);cells.push(b)}
const keypad=$("keypad"),numberKeys=[];
for(let n=1;n<=9;n++){const b=document.createElement("button");b.className="key";b.type="button";b.textContent=n;b.setAttribute("aria-label","Número "+n);b.addEventListener("click",()=>enter(n));keypad.appendChild(b);numberKeys.push(b)}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function makeSolution(){
 const bands=shuffle([0,1,2]),stacks=shuffle([0,1,2]);
 const rows=bands.flatMap(b=>shuffle([0,1,2]).map(r=>b*3+r));
 const cols=stacks.flatMap(s=>shuffle([0,1,2]).map(c=>s*3+c));
 const nums=shuffle([1,2,3,4,5,6,7,8,9]);
 return rows.flatMap(r=>cols.map(c=>nums[(r*3+Math.floor(r/3)+c)%9]));
}
function candidates(a,i){const r=Math.floor(i/9),c=i%9,used=new Set();for(let k=0;k<9;k++){used.add(a[r*9+k]);used.add(a[k*9+c])}const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let y=0;y<3;y++)for(let x=0;x<3;x++)used.add(a[(br+y)*9+bc+x]);const out=[];for(let n=1;n<=9;n++)if(!used.has(n))out.push(n);return out}
function countSolutions(a,limit=2){
 let count=0;
 function walk(){
  if(count>=limit)return;
  let best=-1,opts=null;
  for(let i=0;i<81;i++)if(!a[i]){const c=candidates(a,i);if(!c.length)return;if(!opts||c.length<opts.length){best=i;opts=c;if(c.length===1)break}}
  if(best<0){count++;return}
  for(const n of opts){a[best]=n;walk();a[best]=0;if(count>=limit)return}
 }
 walk();return count
}
function makePuzzle(level){
 solution=makeSolution();puzzle=solution.slice();
 const targets={easy:39,medium:32,hard:27},target=targets[level];
 const order=shuffle(Array.from({length:81},(_,i)=>i));let removed=0;
 for(const i of order){if(81-removed<=target)break;const old=puzzle[i];puzzle[i]=0;if(countSolutions(puzzle.slice(),2)===1)removed++;else puzzle[i]=old}
 notes=Array.from({length:81},()=>new Set());return removed
}
function selectCell(i){if(!started||paused||finished)return;clearHintVisual();selected=i;render()}
function enter(n){
 if(!started||paused||finished||selected<0||original[selected])return;
 clearHintVisual();
 if(noteMode){if(puzzle[selected])return;if(notes[selected].has(n))notes[selected].delete(n);else notes[selected].add(n)}
 else{if(puzzle[selected]&&puzzle[selected]!==n)return;puzzle[selected]=n;notes[selected].clear();if(n!==solution[selected]){mistakes++;$("mistakes").textContent=mistakes}showErrors=false;if(puzzle.every((v,i)=>v===solution[i]))win()}
 render()
}
function erase(){if(!started||paused||finished||selected<0||original[selected])return;clearHintVisual();puzzle[selected]=0;notes[selected].clear();render()}
function getConflicts(){
 const bad=new Set();
 for(let i=0;i<81;i++)if(puzzle[i])for(let j=i+1;j<81;j++)if(puzzle[j]===puzzle[i]){
  const r=Math.floor(i/9),c=i%9,R=Math.floor(j/9),C=j%9;
  if(r===R||c===C||(Math.floor(r/3)===Math.floor(R/3)&&Math.floor(c/3)===Math.floor(C/3))){bad.add(i);bad.add(j)}
 }
 return bad
}
function clearHintVisual(){clearTimeout(hintTimer);hintTimer=null;hintVisual=null;boardEl.classList.remove("hint-active")}
function playHintVisual(visual){
 clearHintVisual();hintVisual={...visual,phase:0};boardEl.classList.add("hint-active");render();
 const advance=()=>{if(!hintVisual)return;hintVisual.phase++;if(hintVisual.phase>=hintVisual.steps.length){clearHintVisual();render();return}render();hintTimer=setTimeout(advance,900)};
 hintTimer=setTimeout(advance,900)
}
function render(){
 const conflicts=getConflicts(),selVal=selected>=0?puzzle[selected]:0;
 for(let i=0;i<81;i++){
  const b=cells[i],v=puzzle[i],r=Math.floor(i/9),c=i%9,sr=selected>=0?Math.floor(selected/9):-1,sc=selected>=0?selected%9:-1;
  b.className="cell";if(c===2||c===5)b.classList.add("box-right");if(r===2||r===5)b.classList.add("box-bottom");if((Math.floor(r/3)*3+Math.floor(c/3))%2===0)b.classList.add("odd-box");
  if(selected>=0&&(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))))b.classList.add("related");
  if(selVal&&v===selVal)b.classList.add("same-number");
  if(i===selected)b.classList.add("selected");
  if(puzzle[i]&&solution[i]===puzzle[i]&&original[i])b.classList.add("given");
  if(conflicts.has(i))b.classList.add("conflict");
  if(showErrors&&v&&v!==solution[i])b.classList.add("wrong");
  if(hintVisual){
   const step=hintVisual.steps[hintVisual.phase];
   if(step.cells.includes(i))b.classList.add("hint-context");
   if(step.blockers.includes(i))b.classList.add("hint-blocker");
   if(step.target&&hintVisual.target===i)b.classList.add("hint-target");
  }
  b.innerHTML="";
  if(v){b.textContent=v;b.setAttribute("aria-label","Linha "+(r+1)+", coluna "+(c+1)+", número "+v)}
  else if(notes[i].size){const box=document.createElement("span");box.className="notes";for(let n=1;n<=9;n++){const s=document.createElement("span");s.textContent=notes[i].has(n)?n:"";box.appendChild(s)}b.appendChild(box);b.setAttribute("aria-label","Linha "+(r+1)+", coluna "+(c+1)+", anotações "+Array.from(notes[i]).join(", "))}
  else{b.setAttribute("aria-label","Linha "+(r+1)+", coluna "+(c+1)+", vazia")}
  b.disabled=!started||paused||finished;
 }
 for(let n=1;n<=9;n++){
  const boxes=new Set();
  for(let i=0;i<81;i++)if(puzzle[i]===n){const r=Math.floor(i/9),c=i%9;boxes.add(Math.floor(r/3)*3+Math.floor(c/3))}
  numberKeys[n-1].hidden=boxes.size===9;
 }
}
let original=[];
function formatTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(started&&!paused&&!finished){seconds++;$("time").textContent=formatTime(seconds)}},1000)}
function newGame(level){
 clearHintVisual();difficulty=level;$("startBtn").disabled=true;$("startBtn").textContent="Preparando…";$("dialogText").textContent="Montando um tabuleiro único para você.";
 setTimeout(()=>{
  const removed=makePuzzle(difficulty);original=puzzle.slice();selected=-1;mistakes=0;hints=3;seconds=0;showErrors=false;noteMode=false;started=true;paused=false;finished=false;
  $("mistakes").textContent="0";$("hints").textContent="3";$("time").textContent="00:00";$("notesBtn").classList.remove("active");$("message").textContent="Partida pronta. Boa sorte!";
  overlay.classList.add("hidden");$("startBtn").disabled=false;$("startBtn").textContent="Começar partida";$("difficulty").value=difficulty;
  render();startTimer()
 },30)
}
function win(){finished=true;started=false;clearInterval(tick);$("message").textContent="Parabéns! Sudoku resolvido em "+formatTime(seconds)+".";$("dialogIcon").textContent="🏆";$("dialogTitle").textContent="Você conseguiu!";$("dialogText").textContent="Você resolveu o Sudoku em "+formatTime(seconds)+". Quer jogar outra partida?";$("startBtn").textContent="Novo Sudoku";$("startBtn").disabled=false;$("resumeBtn").hidden=true;overlay.classList.remove("hidden")}
function togglePause(){if(!started||finished)return;clearHintVisual();paused=!paused;if(paused){$("dialogIcon").textContent="⏸";$("dialogTitle").textContent="Partida pausada";$("dialogText").textContent="Seu tempo está parado. Toque abaixo para continuar."; $("startBtn").hidden=true;$("resumeBtn").hidden=false;overlay.classList.remove("hidden")}else{overlay.classList.add("hidden");$("startBtn").hidden=false;$("resumeBtn").hidden=true}render()}
function hint(){
 clearHintVisual();if(!started||paused||finished||hints<=0)return;
 const wrong=puzzle.some((v,i)=>v&&v!==solution[i]);
 if(wrong){$("message").textContent="Corrija primeiro os números destacados; depois posso explicar a próxima jogada.";return}
 let move=null;
 const explainCell=(i,n)=>{
  const row=Math.floor(i/9),col=i%9,r=row+1,c=col+1,box=Math.floor(row/3)*3+Math.floor(col/3)+1;
  const fmt=a=>a.length?a.join(", "):"nenhum";
  const values=[1,2,3,4,5,6,7,8,9];
  const afterRow=values.filter(v=>!puzzle.slice(row*9,row*9+9).includes(v));
  const colBlocked=afterRow.filter(v=>Array.from({length:9},(_,k)=>puzzle[k*9+col]).includes(v));
  const afterCol=afterRow.filter(v=>!colBlocked.includes(v));
  const br=Math.floor(row/3)*3,bc=Math.floor(col/3)*3;
  const boxValues=Array.from({length:9},(_,k)=>puzzle[(br+Math.floor(k/3))*9+bc+k%3]);
  const boxBlocked=afterCol.filter(v=>boxValues.includes(v));
  const afterBox=afterCol.filter(v=>!boxBlocked.includes(v));
  const explainStep=(label,blocked,remaining)=>{
   if(!blocked.length)return label+" não elimina candidatos; permanecem possíveis "+fmt(remaining)+".";
   return label+", "+(blocked.length===1?"já aparece ":"já aparecem ")+fmt(blocked)+"; "+(remaining.length===1?"resta ":"restam ")+fmt(remaining)+".";
  };
  return "Linha "+r+", coluna "+c+": na linha faltam "+fmt(afterRow)+". "+explainStep("Na coluna "+c,colBlocked,afterCol)+" "+explainStep("No quadrante "+box,boxBlocked,afterBox)+" Portanto, só pode entrar o número "+n+".";
 };
 const buildVisual=(i,unitCells=null)=>{
  const row=Math.floor(i/9),col=i%9,box=Math.floor(row/3)*3+Math.floor(col/3);
  if(unitCells)return {target:i,steps:[{cells:unitCells,blockers:unitCells.filter(j=>puzzle[j]!==0)},{cells:[i],blockers:[],target:true}]};
  const rowCells=Array.from({length:9},(_,k)=>row*9+k),colCells=Array.from({length:9},(_,k)=>k*9+col);
  const boxCells=Array.from({length:9},(_,k)=>(Math.floor(row/3)*3+Math.floor(k/3))*9+Math.floor(col/3)*3+k%3);
  const afterRow=[1,2,3,4,5,6,7,8,9].filter(v=>!rowCells.some(j=>puzzle[j]===v));
  const colBlocked=afterRow.filter(v=>colCells.some(j=>puzzle[j]===v));
  const afterCol=afterRow.filter(v=>!colBlocked.includes(v));
  const boxBlocked=afterCol.filter(v=>boxCells.some(j=>puzzle[j]===v));
  return {target:i,steps:[
   {cells:rowCells,blockers:rowCells.filter(j=>puzzle[j]!==0)},
   {cells:colCells,blockers:colCells.filter(j=>colBlocked.includes(puzzle[j])&&puzzle[j]!==0)},
   {cells:boxCells,blockers:boxCells.filter(j=>boxBlocked.includes(puzzle[j])&&puzzle[j]!==0)},
   {cells:[i],blockers:[],target:true}
  ]};
 };
 for(let i=0;i<81&&!move;i++)if(!puzzle[i]){
  const opts=candidates(puzzle,i);
  if(opts.length===1)move={i,n:opts[0],text:explainCell(i,opts[0]),visual:buildVisual(i)};
 }
 if(!move){
  const units=[];
  for(let r=0;r<9;r++)units.push({name:"linha "+(r+1),cells:Array.from({length:9},(_,c)=>r*9+c)});
  for(let c=0;c<9;c++)units.push({name:"coluna "+(c+1),cells:Array.from({length:9},(_,r)=>r*9+c)});
  for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++)units.push({name:"quadrante "+(br*3+bc+1),cells:Array.from({length:9},(_,k)=>(br*3+Math.floor(k/3))*9+bc*3+k%3)});
  for(const unit of units){
   const missing=[1,2,3,4,5,6,7,8,9].filter(n=>!unit.cells.some(i=>puzzle[i]===n));
   for(const n of missing){
    const places=unit.cells.filter(i=>!puzzle[i]&&candidates(puzzle,i).includes(n));
    if(places.length===1){const i=places[0];move={i,n,text:"Na "+unit.name+", o número "+n+" só pode ocupar a linha "+(Math.floor(i/9)+1)+", coluna "+(i%9+1)+". As outras casas dessa unidade já estão bloqueadas.",visual:buildVisual(i,unit.cells)};break}
   }
   if(move)break;
  }
 }
 if(!move){$("message").textContent="Não há uma dedução direta disponível agora. Tente preencher uma casa possível ou use Conferir.";return}
 selected=move.i;puzzle[move.i]=move.n;notes[move.i].clear();hints--;$("hints").textContent=hints;$("message").textContent="Dica: "+move.text;
 if(puzzle.every((v,k)=>v===solution[k]))win();render();if(move.visual)playHintVisual(move.visual)
}
function check(){
 if(!started||paused||finished)return;
 showErrors=true;const wrong=puzzle.reduce((n,v,i)=>n+(v&&v!==solution[i]?1:0),0);
 $("message").textContent=wrong?wrong+" número(s) incorreto(s) destacado(s).":puzzle.every(Boolean)?"Tudo certo!":"Até agora, tudo certo. Continue preenchendo.";
 if(puzzle.every((v,i)=>v===solution[i]))win();render()
}
$("startBtn").addEventListener("click",()=>{if(finished){$("dialogIcon").textContent="🧩";$("dialogTitle").textContent="Novo Sudoku";$("dialogText").textContent="Escolha o nível e complete cada linha, coluna e bloco com os números de 1 a 9.";$("startBtn").hidden=false;finished=false}newGame($("difficulty").value)});
$("resumeBtn").addEventListener("click",togglePause);
$("newTop").addEventListener("click",()=>{if(started&&!paused&&!finished){paused=true;render()}$("dialogIcon").textContent="🧩";$("dialogTitle").textContent="Novo Sudoku";$("dialogText").textContent="Escolha a dificuldade para começar uma nova partida."; $("startBtn").hidden=false;$("resumeBtn").hidden=true;overlay.classList.remove("hidden")});
$("notesBtn").addEventListener("click",()=>{if(!started||paused||finished)return;noteMode=!noteMode;$("notesBtn").classList.toggle("active",noteMode);$("message").textContent=noteMode?"Modo de anotações ativado.":"Modo de anotações desativado."});
$("eraseBtn").addEventListener("click",erase);$("hintBtn").addEventListener("click",hint);$("checkBtn").addEventListener("click",check);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"||e.key.toLowerCase()==="p"){if(started&&!finished)togglePause();return}
 if(!started||paused||finished)return;
 if(/^[1-9]$/.test(e.key)){enter(Number(e.key));return}
 if(e.key==="Backspace"||e.key==="Delete"){erase();return}
 if(selected<0)return;
 let r=Math.floor(selected/9),c=selected%9;
 if(e.key==="ArrowLeft")c=Math.max(0,c-1);else if(e.key==="ArrowRight")c=Math.min(8,c+1);else if(e.key==="ArrowUp")r=Math.max(0,r-1);else if(e.key==="ArrowDown")r=Math.min(8,r+1);else return;
 e.preventDefault();selected=r*9+c;render()
});
original=Array(81).fill(0);notes=Array.from({length:81},()=>new Set());render();
})();
</script>
